name: Run Agent Evals on Preview

on:
  deployment_status

jobs:
  run-evals:
    # Only react to Vercel's own preview deployments succeeding - not
    # production deploys, and not in-progress/failed ones. The exact
    # "Preview" casing is standard Vercel behavior but hasn't been
    # confirmed against this specific repo's integration; if this gate
    # never fires, log `${{ toJSON(github.event) }}` to see the real value.
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests

      - name: Find the PR for this deployment
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh api repos/${{ github.repository }}/commits/${{ github.event.deployment.sha }}/pulls --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Run evals against the preview
        id: evals
        # Advisory only - a flaky or borderline eval case should never
        # fail this check run or block the PR, same stance CLAUDE.md
        # already states for the Claude Code review.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ALLOWED_USER_EMAIL: ${{ secrets.ALLOWED_USER_EMAIL }}
        run: |
          python api/evals/run_evals.py --base-url "${{ github.event.deployment_status.environment_url }}" | tee eval_output.txt

      - name: Post results
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Agent evals against this preview"
            echo '```'
            cat eval_output.txt
            echo '```'
          } > comment_body.md
          gh pr comment ${{ steps.pr.outputs.number }} --body-file comment_body.md
