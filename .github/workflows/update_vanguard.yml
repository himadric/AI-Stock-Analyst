name: Update Vanguard Tracker

on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas pymongo dnspython beautifulsoup4 lxml yfinance
        
    - name: Run Update Script
      env:
        MONGODB_URI: ${{ secrets.MONGO_URI }}
      run: |
        python api/scripts/update_vanguard_data.py
