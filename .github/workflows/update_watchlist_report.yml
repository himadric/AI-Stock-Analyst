name: Generate Daily Watchlist Report

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC, before US market open (9:30am ET) - weekdays only
    - cron: '0 11 * * 1-5'

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests pymongo dnspython anthropic

    - name: Generate Report
      env:
        MONGODB_URI: ${{ secrets.MONGO_URI }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        python api/scripts/generate_watchlist_report.py
