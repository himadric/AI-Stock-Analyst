name: Update S&P 500 Heatmap Data

on:
  schedule:
    # Run at 21:30 UTC (4:30 PM ET) every weekday
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
        
    - name: Run Update Script
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        # Add other API keys if needed, e.g. FMP if we used it, but we used yfinance (no key) and Wikipedia
      run: |
        python api/scripts/update_snp_heatmap.py
