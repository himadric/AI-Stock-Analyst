name: Update US Senate Tracker

on:
  schedule:
    # Run daily at 02:15 UTC (staggered slightly from House tracker)
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  update-senate-data:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pymongo dnspython python-dotenv
        
    - name: Run Update Script
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: |
        python api/scripts/update_senate_data.py
